<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virich Cyclic Surface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h2 {
            margin-bottom: 0.5rem;
        }

        h3 {
            margin-bottom: 1.5rem;
        }

        .inputContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .inputGroup {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
        }

        .inputGroup label {
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 500;
            color: #dcdcdc;
        }

        .inputGroup input,
        .inputGroup input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffffff;
            outline: none;
            font-size: 1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: border 0.3s ease-in-out, background 0.3s ease-in-out;
        }

        #canvas-holder {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        canvas {
            display: block;
            width: 700px;
            height: 700px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #coordinates {
            margin-bottom: 10px;
            font-size: 1.2rem;
            text-align: center;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <h2>CGW Virich Cyclic Surface</h2>
    <h3>By Tyshchuk Roman</h3>

    <div class="inputContainer">
        <div class="inputGroup">
            <label for="USteps">U Steps</label>
            <input type="number" name="USteps" id="USteps" min="10" max="250" step="1" value="300">
        </div>
        <div class="inputGroup">
            <label for="VSteps">V Steps</label>
            <input type="number" name="VSteps" id="VSteps" min="10" max="250" step="1" value="300">
        </div>
    </div>

    <div class="inputContainer">
        <div class="inputGroup">
            <label for="A">A</label>
            <input type="number" name="A" id="A" min="0" max="10" step="0.1" value="0.75">
        </div>
        <div class="inputGroup">
            <label for="B">B</label>
            <input type="number" name="B" id="B" min="0" max="10" step="0.1" value="1.5">
        </div>
        <div class="inputGroup">
            <label for="C">C</label>
            <input type="number" name="C" id="C" min="0" max="10" step="0.1" value="1.0">
        </div>
        <div class="inputGroup">
            <label for="D">D</label>
            <input type="number" name="D" id="D" min="0" max="10" step="0.1" value="2.0">
        </div>
    </div>

    <div class="inputContainer">
        <div class="inputGroup">
            <label for="Angle">Angle</label>
            <input type="range" name="Angle" id="Angle" min="0" max="360" step="1" value="0">
        </div>
    </div>

    <p id="coordinates">Coordinates: (0, 0)</p>
    <div id="canvas-holder">
        <canvas id="uvcanvas" width="700" height="700"></canvas>
        <canvas id="webglcanvas" width="700" height="700"></canvas>
    </div>

    <script src="./shader.gpu"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./TextureCoord.js"></script>
    <script src="./Texture.js"></script>
    <script src="./Model.js"></script>
    <script src="./main.js"></script>
</body>

</html>
